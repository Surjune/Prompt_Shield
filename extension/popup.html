<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
    .title { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
    .stat-box { background: #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 12px; }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 700; color: #f8fafc; }
    .footer { margin-top: 12px; font-size: 11px; text-align: center; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">ASIPE Security</div>
    <div id="status-dot" class="status-indicator"></div>
  </div>
  <div class="stat-box">
    <span class="stat-label">Engine API:</span>
    <span id="backend-status" class="stat-val">Connecting...</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">Total Scans:</span>
    <span id="scanned-count" class="stat-val">0</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">Blocked Threats:</span>
    <span id="blocked-count" class="stat-val" style="color: #ef4444;">0</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">Redacted Prompts:</span>
    <span id="redacted-count" class="stat-val" style="color: #eab308;">0</span>
  </div>
  <div class="footer">AI Security Interceptor & Policy Engine v1.0</div>
  <script src="popup.js"></script>
</body>
</html>
